name: Daily Shorts

on:
  schedule:
    - cron: "30 3 * * *"    # ~9:00 AM IST  - news
    - cron: "30 8 * * *"    # ~2:00 PM IST  - explainer
    - cron: "30 13 * * *"   # ~7:00 PM IST  - motivation
  workflow_dispatch:
    inputs:
      slot:
        description: "news / explainer / motivation (khali chhodo = auto)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: shorts-run

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make and upload Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_DELAY_MINUTES: ${{ vars.NEWS_DELAY_MINUTES }}
          PRIVACY: ${{ vars.PRIVACY }}
        run: python main.py --slot "${{ github.event.inputs.slot }}"

      - name: Save history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "update history" && git push)
